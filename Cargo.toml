[package]
edition = "2018"
authors = [
    "James Munns <james.munns@ferrous-systems.com>",
]
categories = ["embedded", "no-std"]
description = "Persist panic messages in the targets' RAM"
documentation = "https://docs.rs/panic-persist"
keywords = ["panic-handler", "panic-impl", "panic", "persist"]
license = "MIT OR Apache-2.0"
name = "panic-persist"
repository = "https://github.com/jamesmunns/panic-persist"
version = "0.3.0"
readme = "README.md"

[dependencies]
cortex-m = { version = "0.7.7", optional = true }
rp2040-hal = { version = "0.11.0", optional = true }
rp235x-hal = { version = "0.4.0", optional = true }

[features]
default = []
utf8 = []
cortex-m = ["dep:cortex-m"]
rp2040 = ["dep:rp2040-hal"]
rp235x = ["dep:rp235x-hal"]
min-panic = []

[package.metadata.docs.rs]
all-features = true
